<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng nhập</title>
  <link rel="stylesheet" href="../css/login.css"/>
  <script>
    let checkLogin = localStorage.getItem('login');
    if (checkLogin) {
        window.location.href = "../pages/dashboard.html";
    }
  </script>
</head>
<body>

<div class="toast" id="toast">
    <span class="toast-icon">✔</span>
      <div class="toast-content">
          <strong id="toast-title"></strong>
          <p id="toast-message"></p>
      </div>
</div>

  <div class="card" >
    <h1 class="card_title">Đăng nhập</h1>
    <p class="card_subtitle">Đăng nhập tài khoản để sử dụng hệ thống quản lý.</p>

    <form id="card">
      <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email"/>
        <span class="error-msg" id="emailErr">Sai thông tin đăng nhập! Vui lòng nhập lại</span>
      </div>

      <div class="field">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" />
        <span class="error-msg" id="passwordErr">Sai thông tin đăng nhập! Vui lòng nhập lại</span>
      </div>

      <div class="row-options">
        <label class="checkbox-wrap" id="checkbox">
          <input type="checkbox" name="remember" />
          <span>Nhớ tài khoản</span>
        </label>
        <a href="#">Quên mật khẩu?</a>
      </div>

      <button type="submit" class="btn-submit">Đăng nhập</button>
    </form>

    <p class="card_footer">Bạn chưa có tài khoản? <a href="../pages/register.html">Đăng ký</a></p>
  </div>
  
  <script src="../js/login.js"></script>

</body>
</html>
