<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quản lý sản phẩm</title>
  <link rel="stylesheet" href="../css/product-manager.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script>
    let checkLogin = localStorage.getItem('login');
    if (!checkLogin) {
        window.location.href = "../pages/login.html";
    }
  </script>
</head>
<body>

  <div class="layout">
    <aside class="sidebar">
      <div class="sidebar__logo">
        <span class="logo-icon"><i class="fa-solid fa-fire"></i></span>
        <span class="logo-text">Ecommerce</span>
      </div>
      <nav class="sidebar__nav">
        <a href="../pages/dashboard.html" class="nav-item">
          <span class="nav-icon"><i class="fa-solid fa-house"></i></span> Thống kê
        </a>
        <a href="../pages/category-manager.html" class="nav-item nav-item--active">
          <span class="nav-icon"><i class="fa-solid fa-tags"></i></span> Danh mục
        </a>
        <div class="manager">
          <a href="../pages/product-manager.html" class="nav-item">
            <span class="nav-icon"><i class="fa-regular fa-folder"></i></span> Sản phẩm
          </a>
        </div>
      </nav>
    </aside>

    <div class="main">
      <header class="topbar">
        <div class="topbar_right">
          <span class="topbar_bell"><i class="fa-solid fa-bell"></i></span>
          <img class="topbar_avatar" src="../assets/images/anh1.png" alt="avatar" />
        </div>
      </header>

      <div class="content">
        <div class="page-header">
          <h1 class="page-title">Sản phẩm</h1>
          <button class="btn-add" onclick="openModal()">Thêm mới sản phẩm</button>
        </div>

        <div class="filters">
          <div class="filter-select">
            <select id="selectCategory" class="select-filter">
              <option value="all">Tất cả danh mục</option>
            </select>
            <i class="fa-solid fa-chevron-down"></i>
          </div>
          <div class="filter-select">
            <select id="selectStatus" class="select-filter">
              <option value="all">Tất cả trạng thái</option>
              <option value="active">Đang hoạt động</option>
              <option value="inactive">Ngừng hoạt động</option>
            </select>
            <i class="fa-solid fa-chevron-down"></i>
          </div>
          <div class="search-wrap">
            <input type="text" id="inputSearch" class="search-input" placeholder="Tìm kiếm" />
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
        </div>

        <table class="table">
          <thead>
            <tr>
              <th onclick="toggleSort('id')">Mã sản phẩm <i id="sort-id" class="fa-solid fa-arrow-down"></i></th>
              <th onclick="toggleSort('product_name')">Tên sản phẩm <i id="sort-product_name" class="fa-solid fa-arrow-down"></i></th>
              <th onclick="toggleSort('category')">Danh mục <i id="sort-category" class="fa-solid fa-arrow-down"></i></th>
              <th onclick="toggleSort('price')">Giá <i id="sort-price" class="fa-solid fa-arrow-down"></i></th>
              <th onclick="toggleSort('quantity')">Số lượng <i id="sort-quantity" class="fa-solid fa-arrow-down"></i></th>
              <th onclick="toggleSort('discount')">Giảm giá <i id="sort-discount" class="fa-solid fa-arrow-down"></i></th>
              <th>Trạng thái</th>
              <th>Chức năng</th>
            </tr>
          </thead>
          <tbody id="renderList"></tbody>
        </table>

        <div id="pagination" class="number-pages"></div>
      </div>
    </div>
  </div>

  <!-- Modal Overlay chung -->
  <div class="modal-overlay" id="modalOverlay"></div>

  <!-- ====================== MODAL THÊM SẢN PHẨM ====================== -->
  <div class="modal" id="modal">
    <div class="modal-create">
    <div class="modal-header">
      <span class="modal-title">Thêm mới sản phẩm</span>
      <button class="modal-close" onclick="closeModal()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Mã sản phẩm <span class="required">*</span></label>
          <input id="inputId" type="text" class="form-input" />
          <span class="error-msg" id="idErr"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Tên sản phẩm <span class="required">*</span></label>
          <input id="inputName" type="text" class="form-input" />
          <span class="error-msg" id="nameErr"></span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Danh mục <span class="required">*</span></label>
          <div class="filter-select">
            <select id="inputCategory" class="form-input form-select"></select>
            <i class="fa-solid fa-chevron-down"></i>
          </div>
          <span class="error-msg" id="categoryErr"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Trạng thái</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="status" value="active" checked />
              <span>Đang hoạt động</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="status" value="inactive" />
              <span>Ngừng hoạt động</span>
            </label>
          </div>
        </div>
      </div>

      <div class="form-row three-col">
        <div class="form-group">
          <label class="form-label">Số lượng</label>
          <input type="number" class="form-input" id="inputQuantity" />
          <span class="error-msg" id="quantityErr"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Giá</label>
          <input type="number" class="form-input" id="inputPrice" />
          <span class="error-msg" id="priceErr"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Giảm giá (%)</label>
          <input type="number" class="form-input" id="inputDiscount" />
          <span class="error-msg" id="discountErr"></span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Hình ảnh</label>
        <input type="text" class="form-input" id="inputImage" placeholder="https://..." />
      </div>

      <div class="form-group">
        <label class="form-label">Chi tiết sản phẩm</label>
        <textarea class="form-input form-textarea" id="inputDesc"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Hủy</button>
      <button class="btn-submit" onclick="validateCreate()">Thêm</button>
    </div>
    </div>
  </div>

  <!-- ====================== MODAL SỬA SẢN PHẨM ====================== -->
  <div class="modal" id="modalEdit">
    <div class="modal-edit">
    <div class="modal-header">
      <span class="modal-title">Cập nhật sản phẩm</span>
      <button class="modal-close" onclick="closeModalEdit()">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Mã sản phẩm <span class="required">*</span></label>
          <input type="text" class="form-input" id="editID" />
          <input type="hidden" id="editOriginalID">
          <span class="error-msg" id="editIdErr"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Tên sản phẩm <span class="required">*</span></label>
          <input type="text" class="form-input" id="editName" />
          <span class="error-msg" id="editNameErr"></span>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Danh mục <span class="required">*</span></label>
          <div class="filter-select">
            <select id="editCategory" class="form-input form-select"></select>
            <i class="fa-solid fa-chevron-down"></i>
          </div>
          <span class="error-msg" id="editCategoryErr"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Trạng thái</label>
          <div class="radio-group">
            <label class="radio-label">
              <input type="radio" name="editStatus" value="active" checked />
              <span>Đang hoạt động</span>
            </label>
            <label class="radio-label">
              <input type="radio" name="editStatus" value="inactive" />
              <span>Ngừng hoạt động</span>
            </label>
          </div>
        </div>
      </div>

      <div class="form-row three-col">
        <div class="form-group">
          <label class="form-label">Số lượng</label>
          <input type="number" class="form-input" id="editQuantity" />
          <span class="error-msg" id="editQuantityErr"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Giá</label>
          <input type="number" class="form-input" id="editPrice" />
          <span class="error-msg" id="editPriceErr"></span>
        </div>
        <div class="form-group">
          <label class="form-label">Giảm giá (%)</label>
          <input type="number" class="form-input" id="editDiscount" />
          <span class="error-msg" id="editDiscountErr"></span>
        </div>
      </div>

      <div class="form-group">
        <label class="form-label">Hình ảnh</label>
        <input type="text" class="form-input" id="editImage" placeholder="https://..." />
      </div>

      <div class="form-group">
        <label class="form-label">Chi tiết sản phẩm</label>
        <textarea class="form-input form-textarea" id="editDesc"></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModalEdit()">Hủy</button>
      <button class="btn-submit" onclick="editProduct()">Lưu</button>
    </div>
    </div>
  </div>


  <!-- ====================== MODAL XÓA ====================== -->
  <div class="modal" id="modal-del">
    <div class="modal-delete">
      <div class="icon-error"><i class="fa-solid fa-circle-exclamation"></i></div>
      <div class="del-body">
        <h2>Xác nhận</h2>
        <p id="deleteName"></p>
      </div>
      <div class="del-footer">
        <button class="btn-cancel" onclick="closeModalDelete()">Hủy</button>
        <button class="btn-submit-delete" onclick="deleteProduct()">Xóa</button>
      </div>
    </div>
  </div>

<script src="../js/product-manager.js"></script>

</body>
</html>
