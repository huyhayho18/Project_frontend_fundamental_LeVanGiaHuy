<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Đăng ký tài khoản</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700&display=swap" rel="stylesheet"/>
  <link rel="stylesheet" href="../css/register.css"/>
</head>
<body>

<div class="card">
  <h1 class="card_title">Đăng ký tài khoản</h1>
  <p class="card_subtitle">Đăng ký tài khoản để sử dụng dịch vụ</p>

  <form id="registerForm" novalidate>

    <div class="form-row">

        <div class="field">
            <label for="lastName">Họ và tên đệm</label>
            <input type="text" id="lastName" name="lastName" autocomplete="family-name"/>
        </div>

        <div class="field">
            <label for="firstName">Tên</label>
            <input type="text" id="firstName" name="firstName" autocomplete="given-name"/>
        </div>
    </div>

    <div class="field">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="you@company.com" autocomplete="email"/>
    </div>

    <div class="field">
        <label for="password">Mật khẩu</label>
        <input type="password" id="password" name="password" autocomplete="new-password"/>
    </div>

    <div class="field">
        <label for="confirm">Xác nhận mật khẩu</label>
        <input type="password" id="confirm" name="confirm" autocomplete="new-password"/>
    </div>

    <div class="checkbox-wrap">
        <input type="checkbox" id="terms" name="terms"/>
        <span>Bạn đồng ý với <a href="#">chính sách và điều khoản</a></span>
    </div>

    <button type="submit" class="btn-submit">Đăng ký</button>
  </form>

  <p class="card_footer">Bạn đã có tài khoản? <a href="../pages/login.html">Đăng nhập</a></p>
</div>

</body>
</html>
