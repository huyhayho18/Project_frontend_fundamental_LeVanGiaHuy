<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Quản lý danh mục</title>
  <link rel="stylesheet" href="../css/category-manager.css"/>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
  <script>
    let checkLogin = localStorage.getItem('login');
    if (!checkLogin) {
        window.location.href = "../pages/login.html";
    }
  </script>
</head>
<body>

  <div class="layout">

    <aside class="sidebar">
      <div class="sidebar__logo">
        <span class="logo-icon"><i class="fa-solid fa-fire"></i></span>
        <span class="logo-text">Ecommerce</span>
      </div>
      <nav class="sidebar__nav">
        <a href="../pages/dashboard.html" class="nav-item">
          <span class="nav-icon"><i class="fa-solid fa-house"></i></span> Thống kê
        </a>
        <div class="manager">
        <a href="../pages/category-manager.html" class="nav-item nav-item--active">
          <span class="nav-icon"><i class="fa-solid fa-tags"></i></span> Danh mục
        </a>
        </div>
        <a href="../pages/product-manager.html" class="nav-item">
          <span class="nav-icon"><i class="fa-regular fa-folder"></i></span> Sản phẩm
        </a>
      </nav>
    </aside>

    <div class="main">

      <header class="topbar">
        <div class="topbar_right">
          <span class="topbar_bell"><i class="fa-solid fa-bell"></i></span>
          <img class="topbar_avatar" src="../assets/images/anh1.png" alt="avatar" />
        </div>
      </header>

      <div class="content">

        <div class="page-header">
          <h1 class="page-title">Danh mục</h1>
          <button class="btn-add" onclick="openModal()">Thêm mới danh mục</button>
        </div>

        <div class="filters">
          <div class="filter-select">
          <select class="select-filter" id="select-filter">
            <option value="all">Tất cả</option>
            <option value="active">Đang hoạt động</option>
            <option value="inactive">Ngừng hoạt động</option>
          </select>
          <i class="fa-solid fa-chevron-down"></i>
          </div>
          <div class="search-wrap">
            <input type="text" id="inputSearch" class="search-input" placeholder="Tìm kiếm danh mục theo tên" />
            <i class="fa-solid fa-magnifying-glass"></i>
          </div>
        </div>

        <table class="table">
          <thead>
            <tr>
              <th >
                Mã danh mục <i style="cursor:pointer;" onclick="toggleSort('id')" id="sortIconId" class="fa-solid fa-arrow-down"></i>
              </th>
              <th>
                Tên danh mục <i style="cursor:pointer;" onclick="toggleSort('category_name')" id="sortIconName" class="fa-solid fa-arrow-down"></i>
              </th>
              <th>Trạng thái</th>
              <th>Chức năng</th>
            </tr>
          </thead>
          <tbody id="renderList">
          
          </tbody>
        </table>

        <div class="number-pages" id="pagination">

        </div>

      </div>
    </div>
  </div>

  <div class="modal-overlay" id="modalOverlay" onclick="closeModal()"></div>
  <div class="modal" id="modal">
    <div class="modal-create">
    <div class="modal-header">
      <h2 class="modal-title">Thêm mới danh mục</h2>
      <button class="modal-close" onclick="closeModal()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Mã danh mục <span class="required">*</span></label>
        <input type="text" class="form-input" id="inputId" placeholder="" />
        <span class="error-msg" id="idErr">Không được để trống mã danh mục</span>
      </div>
      <div class="form-group">
        <label class="form-label">Tên danh mục <span class="required">*</span></label>
        <input type="text" class="form-input" id="inputName" placeholder="" />
        <span class="error-msg" id="nameErr">Không được để trống tên danh mục</span>
      </div>
      <div class="form-group">
        <label class="form-label">Trạng thái</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="status" id="inputStatus" value="active" checked />
            <span>Đang hoạt động</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="status" id="inputStatus" value="inactive" />
            <span>Ngừng hoạt động</span>
          </label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModal()">Hủy</button>
      <button class="btn-submit" onclick="validateCreate()">Thêm</button>
    </div>
    </div>
  </div>

  <div class="modal" id="modalEdit">
    <div class="modal-edit">
    <div class="modal-header">
      <h2 class="modal-title">Cập nhật danh mục</h2>
      <button class="modal-close" onclick="closeModalEdit()"><i class="fa-solid fa-xmark"></i></button>
    </div>
    <div class="modal-body">
      <div class="form-group">
        <label class="form-label">Mã danh mục <span class="required">*</span></label>
        <input type="text" class="form-input" id="editID"/>
        <input type="hidden" id="editOriginalID">
        <span class="error-msg" id="idEditErr">Không được để trống mã danh mục</span>
      </div>
      <div class="form-group">
        <label class="form-label">Tên danh mục <span class="required">*</span></label>
        <input type="text" class="form-input" id="editName" />
        <span class="error-msg" id="nameEditErr">Không được để trống tên danh mục</span>
      </div>
      <div class="form-group">
        <label class="form-label">Trạng thái</label>
        <div class="radio-group">
          <label class="radio-label">
            <input type="radio" name="editStatus" id="inputStatus" value="active" checked />
            <span>Đang hoạt động</span>
          </label>
          <label class="radio-label">
            <input type="radio" name="editStatus" id="inputStatus" value="inactive" />
            <span>Ngừng hoạt động</span>
          </label>
        </div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn-cancel" onclick="closeModalEdit()">Hủy</button>
      <button class="btn-submit" onclick="editCategory()">Lưu</button>
    </div>
  </div>
  </div>

  <div class="modal" id="modal-del">
    <div class="modal-delete">
      <div class="icon-error"><i class="fa-solid fa-circle-exclamation"></i></div>
      <div class="del-body">
        <h2>Xác nhận</h2>
        <p id="deleteName"></p>
      </div>
      <div class="del-footer">
        <button class="btn-cancel" onclick="closeModalDelete()">Hủy</button>
        <button class="btn-submit-delete" onclick="delCategory()">Xóa</button>
      </div>
    </div>
  </div>


  <script>
    function openModal() {
      document.getElementById('modal').classList.add('active');
      document.getElementById('modalOverlay').classList.add('active');
    }
    function closeModal() {
      document.getElementById('modal').classList.remove('active');
      document.getElementById('modalOverlay').classList.remove('active');
    }

    function openModalEdit(id, name, status) {
    document.getElementById('editID').value = id;
    document.getElementById('editOriginalID').value = id;
    document.getElementById('editName').value = name;
    const radios = document.querySelectorAll('input[name="editStatus"]');
    radios.forEach(r => r.checked = (r.value === status));
    document.getElementById('modalEdit').classList.add('active');
    document.getElementById('modalOverlay').classList.add('active');
    }

    function closeModalEdit() {
      document.getElementById('modalEdit').classList.remove('active');
      document.getElementById('modalOverlay').classList.remove('active');
    }

    let delId = null;
    function openModelDelete(id, name) {
      delId = id;
      document.getElementById('deleteName').textContent =
        `Bạn có chắc chắn muốn xóa danh mục "${name}" khỏi hệ thống không?`;
      document.getElementById('modal-del').classList.add('active');
      document.getElementById('modalOverlay').classList.add('active');
  }
  function closeModalDelete() {
    document.getElementById('modal-del').classList.remove('active');
    document.getElementById('modalOverlay').classList.remove('active');
  }
  </script>

  <script src="../js/category-manager.js"></script>

</body>
</html>
